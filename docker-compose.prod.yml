services:
  sms-reader:
    image: ${APP_IMAGE:-sms-serial-reader}:${APP_VERSION:-1.0.0}
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-1.0.0}
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DELETE_SMS_AFTER_READ: ${DELETE_SMS_AFTER_READ:-true}
      MANAGEMENT_HEALTH_SHOW_DETAILS: never
      LOG_LEVEL: INFO
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 256M

  nginx:
    image: nginx:1.27-alpine
    container_name: sms-reader-nginx
    restart: unless-stopped
    depends_on:
      sms-reader:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
