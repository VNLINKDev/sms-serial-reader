services:
  redis:
    image: redis:7.2-alpine
    container_name: sms-reader-redis
    restart: unless-stopped
    command: >
      sh -c 'if [ -n "$$REDIS_PASSWORD" ]; then
        redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD";
      else
        redis-server --appendonly yes;
      fi'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$$REDIS_PASSWORD\" ]; then redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG; else redis-cli ping | grep -q PONG; fi"]
      interval: 10s
      timeout: 5s
      retries: 5

  sms-reader:
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-1.0.0}
    image: ${APP_IMAGE:-sms-serial-reader}:${APP_VERSION:-1.0.0}
    container_name: sms-serial-reader
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
      SERIAL_PORT: ${SERIAL_DEVICE:-/dev/ttyUSB0}
      LOG_PATH: /app/logs
    devices:
      - "${SERIAL_DEVICE:-/dev/ttyUSB0}:${SERIAL_DEVICE:-/dev/ttyUSB0}"
    group_add:
      - dialout
    volumes:
      - ./logs:/app/logs

volumes:
  redis-data:
