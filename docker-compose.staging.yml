services:
  sms-reader:
    image: ${APP_IMAGE:-sms-serial-reader}:${APP_VERSION:-1.0.0}
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-1.0.0}
    environment:
      SPRING_PROFILES_ACTIVE: staging
      DELETE_SMS_AFTER_READ: ${DELETE_SMS_AFTER_READ:-false}
      MANAGEMENT_HEALTH_SHOW_DETAILS: when_authorized
      LOG_LEVEL: INFO
