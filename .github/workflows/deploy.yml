name: build-and-deploy

on:
  push:
    branches:
      - main
      - staging
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run tests
        run: mvn -B clean verify

  build-image:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image metadata
        id: meta
        run: |
          IMAGE="${REGISTRY}/${IMAGE_NAME}"
          TAG="${GITHUB_SHA::12}"
          echo "image=${IMAGE,,}" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        run: docker build -t "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}" .

      - name: Push Docker image
        run: docker push "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}"

  deploy:
    runs-on: ubuntu-latest
    needs: build-image
    environment: ${{ github.event.inputs.environment || (github.ref_name == 'main' && 'production' || 'staging') }}
    env:
      TARGET_ENV: ${{ github.event.inputs.environment || (github.ref_name == 'main' && 'production' || 'staging') }}
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT }}
          script_stop: true
          script: |
            set -Eeuo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"

            cp .env ".env.backup.$(date +%Y%m%d-%H%M%S)"
            if docker compose ps sms-reader >/dev/null 2>&1; then
              docker compose images -q sms-reader | head -n1 > .previous-image || true
            fi

            docker login ghcr.io -u "${{ secrets.REGISTRY_USERNAME }}" -p "${{ secrets.REGISTRY_TOKEN }}"
            export APP_IMAGE="${{ needs.build-image.outputs.image }}"
            export APP_VERSION="${{ needs.build-image.outputs.tag }}"

            if [ "${{ env.TARGET_ENV }}" = "production" ]; then
              docker compose -f docker-compose.yml -f docker-compose.prod.yml pull sms-reader
              docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans
            else
              docker compose -f docker-compose.yml -f docker-compose.staging.yml pull sms-reader
              docker compose -f docker-compose.yml -f docker-compose.staging.yml up -d --remove-orphans
            fi

            for i in $(seq 1 30); do
              if curl -fsS "http://127.0.0.1:${SERVER_PORT:-8080}/actuator/health" | grep -q '"status":"UP"'; then
                echo "Health check passed"
                exit 0
              fi
              sleep 5
            done

            echo "Health check failed, rolling back"
            ./scripts/rollback.sh "${{ env.TARGET_ENV }}"
            exit 1
