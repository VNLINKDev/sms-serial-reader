spring:
  application:
    name: sms-serial-reader
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:30s}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS:health,info,prometheus}
  endpoint:
    health:
      show-details: ${MANAGEMENT_HEALTH_SHOW_DETAILS:when_authorized}
      probes:
        enabled: true
  info:
    env:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

info:
  app:
    name: sms-serial-reader
    description: GSM modem SMS reader

sms:
  serial:
    port: ${SERIAL_PORT:COM9}
    baud-rate: ${BAUD_RATE:115200}
  redis:
    host: ${REDIS_HOST:127.0.0.1}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    database: ${REDIS_DATABASE:0}
    queue-name: ${REDIS_QUEUE_NAME:sms:incoming}
    mode: ${REDIS_MODE:VALUE}
    publish-retries: ${REDIS_PUBLISH_RETRIES:3}
  behavior:
    delete-sms-after-read: ${DELETE_SMS_AFTER_READ:false}
    unread-poll-interval-ms: ${UNREAD_POLL_INTERVAL_MS:60000}
